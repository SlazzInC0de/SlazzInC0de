name: Profile 3D contributions

on:
  schedule:
    - cron: "45 0 * * *"   # daily, 6:15 AM IST
  push:
    branches: [main]
    paths:
      - ".github/profile-3d.json"
      - ".github/workflows/profile-3d.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graphics
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Commit graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add profile-3d-contrib/
          git diff --cached --quiet || (git commit -m "chore: update 3D contribution graphics [skip ci]" && git push)
