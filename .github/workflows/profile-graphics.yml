name: Profile graphics

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 * * * *"    # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Contribution Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Recolor Pac-Man graph to profile red theme
        run: |
          mv dist/pacman-contribution-graph-dark.svg dist/contrib-dark.svg
          mv dist/pacman-contribution-graph.svg dist/contrib-light.svg
          sed -i -e 's/#0d1117/#070101/Ig' \
                 -e 's/#161b22/#140303/Ig' \
                 -e 's/#0e4429/#4d0b0b/Ig' \
                 -e 's/#006d32/#8f1414/Ig' \
                 -e 's/#26a641/#cc1f1f/Ig' \
                 -e 's/#39d353/#ff3b3b/Ig' dist/contrib-dark.svg

      - name: Header, project cards, stats and language cards
        run: |
          python3 scripts/header.py
          python3 scripts/cards.py
          python3 scripts/stats.py
        env:
          # STATS_TOKEN (optional PAT, read:user + repo) also counts private contributions
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit graphics
        run: |
          cp dist/*.svg assets/
          # bump ?v= on image links so browsers/GitHub drop cached copies
          if ! git diff --quiet -- assets/; then
            sed -i -E "s#(assets/[A-Za-z-]+\.svg)(\?v=[0-9]+)?#\1?v=$(date +%s)#g" README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet || (git commit -m "chore: update profile graphics [skip ci]" && git pull --rebase origin main && git push)
