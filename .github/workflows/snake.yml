name: Profile graphics

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 * * * *"    # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib-dark.svg?color_empty=%23140303&color_dot_border=%232a0606&color_snake=%23ff2b2b&color_dots=%23140303,%234d0b0b,%238f1414,%23cc1f1f,%23ff3b3b
            dist/contrib-light.svg?color_snake=%23b91c1c&color_dots=%23ebedf0,%23fecaca,%23f87171,%23dc2626,%23991b1b

      - name: Header, stats and language cards
        run: |
          python3 scripts/header.py
          python3 scripts/stats.py
        env:
          # STATS_TOKEN (optional PAT, read:user + repo) also counts private contributions
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit graphics
        run: |
          cp dist/*.svg assets/
          # bump ?v= on image links so browsers/GitHub drop cached copies
          if ! git diff --quiet -- assets/; then
            sed -i -E "s#(assets/[A-Za-z-]+\.svg)(\?v=[0-9]+)?#\1?v=$(date +%s)#g" README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet || (git commit -m "chore: update profile graphics [skip ci]" && git pull --rebase origin main && git push)
