name: Contribution graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, 6:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib-dark.svg?color_snake=#22d3ee&color_dots=#1e293b,#0c4a5e,#0e7490,#06b6d4,#22d3ee
            dist/contrib-light.svg?color_snake=#0e7490&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#0e7490

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
