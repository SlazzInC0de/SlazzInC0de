name: Contribution graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, 6:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib-dark.svg?color_snake=%2322d3ee&color_dots=%231e293b,%230c4a5e,%230e7490,%2306b6d4,%2322d3ee
            dist/contrib-light.svg?color_snake=%230e7490&color_dots=%23ebedf0,%23a5f3fc,%2322d3ee,%230891b2,%230e7490

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
