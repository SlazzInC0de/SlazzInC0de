th d="M780,254 h40" fill="none" stroke="#ffe3e3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.58;0.66;0.92;1" dur="7s" repeatCount="indefinite"/></path><text x="595" y="214" text-anchor="middle" class="t-ns">input</text><text x="740" y="214" text-anchor="middle" class="t-ns">output</text><text x="40" y="244" class="t-sm">no generated images. every diagram is drawn stroke by stroke,</text><text x="40" y="260" class="t-sm">narrated live, and pauses when you ask a doubt.</text>
