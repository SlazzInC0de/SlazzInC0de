<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <style>
    .k { font: 500 13px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #8a2a2a; letter-spacing: 2px; }
    .n { font: 800 24px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ff2b2b; letter-spacing: 3px; }
    .cur { fill: #ff2b2b; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateX(-120px); } to { transform: translateX(900px); } }
  </style>
  <defs>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ff2b2b"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></linearGradient>
    <linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/><stop offset=".5" stop-color="#ffd0d0"/><stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/></linearGradient>
  </defs>
  <text x="0" y="16" class="k">[0x05]</text>
  <text x="0" y="42" class="n">CONTRIBUTION ACTIVITY</text>
  <rect class="cur" x="374" y="22" width="12" height="22"/>
  <rect x="0" y="51" width="900" height="1.5" fill="url(#ln)"/>
  <rect class="scan" x="0" y="50.5" width="120" height="2.5" fill="url(#sc)"/>
</svg>
