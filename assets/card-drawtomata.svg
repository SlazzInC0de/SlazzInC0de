<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370">
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff2b2b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t-id { font: 700 13px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ff2b2b; letter-spacing: 3px; }
    .t-st { font: 500 10px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #a35a5a; letter-spacing: 2px; }
    .t-rp { font: 500 11px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #a35a5a; letter-spacing: 1px; }
    .t-hd { font: 800 22px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ffe3e3; }
    .t-sb { font: 400 12.5px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #a35a5a; }
    .t-ch { font: 700 10px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ffe3e3; letter-spacing: 1.5px; }
    .t-nl { font: 700 11.5px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ffe3e3; letter-spacing: 1px; }
    .t-ns { font: 400 9.5px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #a35a5a; }
    .t-mv { font: 800 26px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ff2b2b; }
    .t-ml { font: 500 9.5px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #6e2222; letter-spacing: 2.5px; }
    .t-sm { font: 500 10px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #a35a5a; letter-spacing: 1.5px; }
    .t-ok { font: 700 11px 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace; fill: #ff2b2b; letter-spacing: 1px; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .flow { stroke-dasharray: 4 5; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -9; } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
</style>
  <rect width="900" height="370" fill="#070101"/>
  <rect x="12" y="12" width="876" height="346" fill="#0d0202" stroke="#5a1010"/>
  <text x="40" y="46" class="t-id">02 · DRAWTOMATA</text>
  <circle cx="212" cy="42" r="4" fill="#ff2b2b" class="pulse"/>
  <text x="224" y="46" class="t-st">LIVE · VERCEL</text>
  <text x="860" y="46" text-anchor="end" class="t-rp">-&gt; /drawtomata</text>
