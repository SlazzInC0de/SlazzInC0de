120303;#3a0808;#120303;#120303" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="stroke" values="#5a1010;#ff2b2b;#5a1010;#5a1010" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="2.0s" repeatCount="indefinite"/></rect><text x="450" y="202" text-anchor="middle" class="t-nl">NFA</text><rect x="559" y="178" width="128" height="40" fill="#120303" stroke="#5a1010"><animate attributeName="fill" values="#120303;#3a0808;#120303;#120303" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="3.0s" repeatCount="indefinite"/><animate attributeName="stroke" values="#5a1010;#ff2b2b;#5a1010;#5a1010" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="3.0s" repeatCount="indefinite"/></rect><text x="623" y="202" text-anchor="middle" class="t-nl">DFA</text><rect x="732" y="178" width="128" height="40" fill="#120303" stroke="#5a1010"><animate attributeName="fill" values="#120303;#3a0808;#120303;#120303" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="4.0s" repeatCount="indefinite"/><animate attributeName="stroke" values="#5a1010;#ff2b2b;#5a1010;#5a1010" keyTimes="0;0.1;0.25;1" dur="5.0s" begin="4.0s" repeatCount="indefinite"/></rect><text x="796" y="202" text-anchor="middle" class="t-nl">MIN-DFA</text><text x="40" y="248" class="t-sm">EQUIVALENCE CHECK</text><rect x="200" y="238" width="510" height="12" fill="none" stroke="#5a1010"/><rect x="202" y="240" height="8" fill="#ff2b2b" width="0"><animate attributeName="width" values="0;506;506;0" keyTimes="0;0.7;0.95;1" dur="5s" repeatCount="indefinite"/></rect><text x="724" y="248" class="t-ok" opacity="0">L(in) = L(out)  OK<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.71;0.95;1" dur="5s" repeatCount="indefinite"/></text>
