<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #22d3ee; }
    .l { font: 400 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #94a3b8; }
    .v { font: 700 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .big { font: 800 30px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .cap { font: 500 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 1.5px; }
    .row { animation: fade .6s ease-out backwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { stroke-dashoffset: 251; } }
  </style>
  <rect x="0.5" y="0.5" width="449" height="199" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="25" y="38" class="t">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="58" width="400" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="58" width="164.49" height="10" fill="#f1e05a"/>
    <rect x="188.99" y="58" width="108.13" height="10" fill="#3572A5"/>
    <rect x="296.62" y="58" width="95.74" height="10" fill="#e34c26"/>
    <rect x="391.86" y="58" width="21.30" height="10" fill="#663399"/>
    <rect x="412.66" y="58" width="11.28" height="10" fill="#b07219"/>
    <rect x="423.44" y="58" width="2.06" height="10" fill="#844FBA"/>
  </g>
  <g class="row" style="animation-delay:150ms"><circle cx="31" cy="97" r="5" fill="#f1e05a"/><text x="45" y="102" class="v">JavaScript</text><text x="216" y="102" class="l" text-anchor="end">41.0%</text></g>
  <g class="row" style="animation-delay:250ms"><circle cx="241" cy="97" r="5" fill="#3572A5"/><text x="255" y="102" class="v">Python</text><text x="426" y="102" class="l" text-anchor="end">26.9%</text></g>
  <g class="row" style="animation-delay:350ms"><circle cx="31" cy="129" r="5" fill="#e34c26"/><text x="45" y="134" class="v">HTML</text><text x="216" y="134" class="l" text-anchor="end">23.8%</text></g>
  <g class="row" style="animation-delay:450ms"><circle cx="241" cy="129" r="5" fill="#663399"/><text x="255" y="134" class="v">CSS</text><text x="426" y="134" class="l" text-anchor="end">5.2%</text></g>
  <g class="row" style="animation-delay:550ms"><circle cx="31" cy="161" r="5" fill="#b07219"/><text x="45" y="166" class="v">Java</text><text x="216" y="166" class="l" text-anchor="end">2.7%</text></g>
  <g class="row" style="animation-delay:650ms"><circle cx="241" cy="161" r="5" fill="#844FBA"/><text x="255" y="166" class="v">HCL</text><text x="426" y="166" class="l" text-anchor="end">0.4%</text></g>
</svg>
